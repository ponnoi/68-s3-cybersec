version: "3.9"

services:
  s3admin:
    image: dpage/pgadmin4:latest
    container_name: 68-s3-admin
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:${PGADMIN_PORT}:5050"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - backend_net

volumes:
  pgadmin_data:

networks:
  backend_net:
    driver: bridge
