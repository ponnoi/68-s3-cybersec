s3app:
  container_name: 68-s3-app
  image: prawee/strapi
  restart: unless-stopped
  ports:
    - "${APP_PORT}:1337"
  env_file:
    - .env
  environment:
    NODE_ENV: ${NODE_ENV}

    DATABASE_CLIENT: postgres
    DATABASE_HOST: ${DB_HOST}
    DATABASE_PORT: 5432
    DATABASE_NAME: ${DATABASE_NAME}
    DATABASE_USERNAME: ${DATABASE_USER}
    DATABASE_PASSWORD: ${DATABASE_PASS}

  depends_on:
    - s3db
